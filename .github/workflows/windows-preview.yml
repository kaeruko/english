name: Windows Preview Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: windows_preview

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install "fastapi>=0.115,<1"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Check browser JavaScript
        run: node --check static/app.js

      - name: Check PowerShell launcher
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath start_windows_preview.ps1 -Raw
          [scriptblock]::Create($source) | Out-Null
