name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Xcode 26
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project EnglishReplay.xcodeproj \
            -scheme EnglishReplay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build \
            | tee xcodebuild.log

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EnglishReplay-simulator
          path: DerivedData/Build/Products/Debug-iphonesimulator/EnglishReplay.app
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-diagnostics
          path: xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
